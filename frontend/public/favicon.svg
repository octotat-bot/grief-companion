<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background (Optional, but good for standalone viewing) -->
  <rect width="100" height="100" rx="20" fill="#151413"/>
  
  <!-- Glowing subtle aura -->
  <circle cx="50" cy="50" r="30" fill="#c8a84b" opacity="0.1" filter="blur(10px)"/>

  <!-- Elegant folded letter / leaf / star motif -->
  <path d="M50 20 L55 45 L80 50 L55 55 L50 80 L45 55 L20 50 L45 45 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M50 30 L52 48 L70 50 L52 52 L50 70 L48 52 L30 50 L48 48 Z" fill="#f0ead8"/>

  <defs>
    <linearGradient id="goldGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0ce9a" />
      <stop offset="50%" stop-color="#c8a84b" />
      <stop offset="100%" stop-color="#8a6b22" />
    </linearGradient>
  </defs>
</svg>
